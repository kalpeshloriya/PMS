{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Manager Dashboard</h2>
<div class="row g-3 mb-4">
  <div class="col-md-3"><div class="card p-3"><div class="small-muted">Team Members</div><div class="h3">{{ kpis.team_members }}</div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="small-muted">Skills Assessed</div><div class="h3">{{ kpis.skills_assessed }}</div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="small-muted">Open Gaps</div><div class="h3">{{ kpis.open_gaps }}</div></div></div>
  <div class="col-md-3"><div class="card p-3"><div class="small-muted">Avg Weighted Gap</div><div class="h3">{{ '%.2f'|format(kpis.avg_gap) }}</div></div></div>
</div>
<div class="row g-4">
  <div class="col-md-7"><div class="card p-3"><h5>Top Competency Gaps</h5><canvas id="barTopGaps" height="160"></canvas></div></div>
  <div class="col-md-5"><div class="card p-3"><h5>Gap Distribution</h5><canvas id="pieGaps" height="160"></canvas></div></div>
</div>
<script>
  const barCtx = document.getElementById('barTopGaps');
  const barData = {{ charts.top_gaps|tojson }};
  new Chart(barCtx, {type:'bar', data:{labels:barData.labels,datasets:[{label:'Open Gaps',backgroundColor:'#3b82f6',data:barData.data}]}, options:{scales:{y:{beginAtZero:true}}}});
  const pieCtx = document.getElementById('pieGaps');
  const pieData = {{ charts.gap_distribution|tojson }};
  new Chart(pieCtx, {type:'doughnut', data:{labels:pieData.labels,datasets:[{data:pieData.data,backgroundColor:['#ef4444','#f59e0b','#22c55e']}]} });
</script>
{% endblock %}
